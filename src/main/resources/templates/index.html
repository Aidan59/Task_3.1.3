<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin panel</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <style>
        body { background: #f8f9fa; }
        .sidebar { background: #fff; min-height: calc(100vh - 56px); }
    </style>
</head>
<body>

<div th:replace="~{fragments :: navbar}"></div>

<div class="container-fluid">
    <div class="row">

        <div class="col-md-2 sidebar px-0">
            <div th:replace="~{fragments :: sidebar('admin')}"></div>
        </div>

        <main class="col-md-10 pt-3 px-4 pb-5"
              th:with="showNew=${user.id == 0 and user.name != null}">

            <h1>Admin panel</h1>

            <div th:object="${user}">
                <div class="alert alert-danger mt-3" th:if="${#fields.hasErrors('*')}">
                    <div th:each="err : ${#fields.allErrors()}" th:text="${err}">Error</div>
                </div>
            </div>

            <ul class="nav nav-tabs mt-3">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${!showNew} ? 'active'"
                       data-toggle="tab" href="#table-pane">Users table</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${showNew} ? 'active'"
                       data-toggle="tab" href="#new-pane">New User</a>
                </li>
            </ul>

            <div class="tab-content bg-white border border-top-0 p-4">

                <div class="tab-pane fade" id="table-pane" th:classappend="${!showNew} ? 'show active'">
                    <h5 class="mb-3">All users</h5>
                    <div class="table-responsive">
                        <table class="table table-striped">
                            <thead>
                            <tr>
                                <th>ID</th>
                                <th>First Name</th>
                                <th>Last Name</th>
                                <th>Age</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Edit</th>
                                <th>Delete</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:if="${#lists.isEmpty(users)}">
                                <td colspan="8" class="text-center text-muted">No users yet</td>
                            </tr>
                            <tr th:each="u : ${users}">
                                <td th:text="${u.id}">1</td>
                                <td th:text="${u.name}">admin</td>
                                <td th:text="${u.surname}">admin</td>
                                <td th:text="${u.age}">35</td>
                                <td th:text="${u.email}">admin@mail.ru</td>
                                <td>
                                    <span th:each="r : ${u.roles}"
                                          th:text="${#strings.replace(r.name, 'ROLE_', '')} + ' '">ADMIN</span>
                                </td>
                                <td>
                                    <button type="button" class="btn btn-info btn-sm text-white"
                                            data-toggle="modal"
                                            th:attr="data-target='#editModal' + ${u.id}">Edit</button>
                                </td>
                                <td>
                                    <button type="button" class="btn btn-danger btn-sm"
                                            data-toggle="modal"
                                            th:attr="data-target='#deleteModal' + ${u.id}">Delete</button>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="tab-pane fade" id="new-pane" th:classappend="${showNew} ? 'show active'">
                    <h5 class="mb-3">Add new user</h5>
                    <form th:action="@{/admin}" method="post" class="col-md-6 px-0">
                        <div th:replace="~{fragments :: userFields(${user}, 'new', true)}"></div>
                        <button type="submit" class="btn btn-success mt-3">Add new user</button>
                    </form>
                </div>
            </div>

            <th:block th:each="u : ${users}">

                <div class="modal fade" th:id="'editModal' + ${u.id}" tabindex="-1">
                    <div class="modal-dialog modal-dialog-scrollable">
                        <div class="modal-content">
                            <form th:action="@{/admin/update}" method="post">
                                <div class="modal-header">
                                    <h5 class="modal-title">Edit user</h5>
                                    <button type="button" class="close" data-dismiss="modal">&times;</button>
                                </div>
                                <div class="modal-body">
                                    <input type="hidden" name="id" th:value="${u.id}">
                                    <div th:replace="~{fragments :: userFields(${u}, ${'edit' + u.id}, false)}"></div>
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                                    <button type="submit" class="btn btn-primary">Edit</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

                <div class="modal fade" th:id="'deleteModal' + ${u.id}" tabindex="-1">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <form th:action="@{/admin/delete(id=${u.id})}" method="post">
                                <div class="modal-header">
                                    <h5 class="modal-title">Delete user</h5>
                                    <button type="button" class="close" data-dismiss="modal">&times;</button>
                                </div>
                                <div class="modal-body">
                                    Are you sure you want to delete
                                    <strong th:text="${u.email}">user@mail.ru</strong>?
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                                    <button type="submit" class="btn btn-danger">Delete</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

            </th:block>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>User information-page</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <style>
        body { background: #f8f9fa; }
        .sidebar { background: #fff; min-height: calc(100vh - 56px); }
    </style>
</head>
<body>

<div th:replace="~{fragments :: navbar}"></div>

<div class="container-fluid">
    <div class="row">

        <div class="col-md-2 sidebar px-0">
            <div th:replace="~{fragments :: sidebar('user')}"></div>
        </div>

        <main class="col-md-10 pt-3 px-4 pb-5"
              th:with="u=${user != null ? user : currentUser}">

            <h1>User information-page</h1>

            <div class="card mt-3">
                <div class="card-header"><h5 class="mb-0">About user</h5></div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-striped mb-0">
                            <thead>
                            <tr>
                                <th>ID</th>
                                <th>First Name</th>
                                <th>Last Name</th>
                                <th>Age</th>
                                <th>Email</th>
                                <th>Position</th>
                                <th>Salary</th>
                                <th>Employment</th>
                                <th>Role</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr>
                                <td th:text="${u.id}">1</td>
                                <td th:text="${u.name}">user</td>
                                <td th:text="${u.surname}">user</td>
                                <td th:text="${u.age}">30</td>
                                <td th:text="${u.email}">user@mail.ru</td>
                                <td th:text="${u.position != null and !#strings.isEmpty(u.position)} ? ${u.position} : '—'">Developer</td>
                                <td th:text="${u.salary != null} ? ${#numbers.formatDecimal(u.salary, 1, 'COMMA', 2, 'POINT')} : '—'">0.00</td>
                                <td th:text="${u.employmentType != null} ? ${u.employmentType} : '—'">FULL_TIME</td>
                                <td>
                                    <span th:each="r : ${u.roles}"
                                          th:text="${#strings.replace(r.name, 'ROLE_', '')} + ' '">USER</span>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

</body>
</html>

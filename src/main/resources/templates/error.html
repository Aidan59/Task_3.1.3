<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'Error ' + ${status}">Error</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <style>
        body { background: #f8f9fa; }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center align-items-center" style="min-height: 100vh">
        <div class="col-11 col-sm-8 col-md-6 col-lg-5">
            <div class="card shadow-sm text-center">
                <div class="card-body p-5">
                    <p class="display-3 font-weight-bold text-danger mb-2" th:text="${status}">500</p>

                    <h4 th:switch="${status}">
                        <span th:case="403">Access denied</span>
                        <span th:case="404">Page not found</span>
                        <span th:case="400">Bad request</span>
                        <span th:case="405">Method not allowed</span>
                        <span th:case="*">Something went wrong</span>
                    </h4>

                    <p class="text-muted mb-2" th:switch="${status}">
                        <span th:case="403">You don't have permission to view this page.</span>
                        <span th:case="404">The page you are looking for doesn't exist or was moved.</span>
                        <span th:case="*">The request could not be completed. Please try again.</span>
                    </p>

                    <p class="small text-muted mb-1"
                       th:if="${message != null and !#strings.isEmpty(message)}" th:text="${message}">Details</p>
                    <p class="small text-muted mb-0" th:if="${path != null}" th:text="${path}">/path</p>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>

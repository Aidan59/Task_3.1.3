<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<nav th:fragment="navbar" class="navbar navbar-dark px-4" style="background-color: #2f6f6d">
    <span class="navbar-text text-white" style="font-size: 1.25rem">
        <strong th:text="${currentUser.email}">admin@mail.ru</strong>
        with roles:
        <span th:each="r : ${currentUser.roles}"
              th:text="${#strings.replace(r.name, 'ROLE_', '')} + ' '">ADMIN</span>
    </span>
    <form th:action="@{/logout}" method="post" class="form-inline">
        <button type="submit" class="btn btn-link text-white-50 p-0">Logout</button>
    </form>
</nav>

<div th:fragment="sidebar(active)" class="nav flex-column nav-pills pt-3">
    <a th:if="${currentUser.authorities.![authority].contains('ROLE_ADMIN')}"
       class="nav-link" th:classappend="${active == 'admin'} ? 'active'"
       th:href="@{/admin}">Admin</a>
    <a class="nav-link" th:classappend="${active == 'user'} ? 'active'"
       th:href="@{/user}">User</a>
</div>

<div th:fragment="userFields(u, p, isNew)">
    <div class="form-group">
        <label th:for="${p} + '-name'">First name</label>
        <input class="form-control" type="text" name="name" th:id="${p} + '-name'"
               th:value="${u.name}" required>
    </div>
    <div class="form-group">
        <label th:for="${p} + '-surname'">Last name</label>
        <input class="form-control" type="text" name="surname" th:id="${p} + '-surname'"
               th:value="${u.surname}">
    </div>
    <div class="form-group">
        <label th:for="${p} + '-age'">Age</label>
        <input class="form-control" type="number" name="age" min="18" max="120"
               th:id="${p} + '-age'" th:value="${u.age}" required>
    </div>
    <div class="form-group">
        <label th:for="${p} + '-email'">Email (login)</label>
        <input class="form-control" type="email" name="email" th:id="${p} + '-email'"
               th:value="${u.email}" required>
    </div>
    <div class="form-group">
        <label th:for="${p} + '-password'" th:text="${isNew} ? 'Password' : 'New password'">Password</label>
        <input class="form-control" type="password" name="password" autocomplete="new-password"
               th:id="${p} + '-password'" th:required="${isNew}"
               th:placeholder="${isNew} ? '' : 'Leave blank to keep current'">
    </div>
    <div class="form-group">
        <label th:for="${p} + '-position'">Position</label>
        <input class="form-control" type="text" name="position" th:id="${p} + '-position'"
               th:value="${u.position}">
    </div>
    <div class="form-group">
        <label th:for="${p} + '-salary'">Salary</label>
        <input class="form-control" type="number" name="salary" min="0" step="0.01"
               th:id="${p} + '-salary'" th:value="${u.salary}">
    </div>
    <div class="form-group">
        <label th:for="${p} + '-type'">Employment type</label>
        <select class="form-control" name="employmentType" th:id="${p} + '-type'">
            <option value="">Not specified</option>
            <option th:each="t : ${employmentTypes}" th:value="${t}" th:text="${t}"
                    th:selected="${u.employmentType == t}">FULL_TIME</option>
        </select>
    </div>
    <div class="form-group mb-0">
        <label class="d-block">Roles</label>
        <div class="form-check form-check-inline" th:each="r : ${allRoles}">
            <input class="form-check-input" type="checkbox" name="roleIds"
                   th:id="${p} + '-role-' + ${r.id}" th:value="${r.id}"
                   th:checked="${u.roles.![id].contains(r.id)}">
            <label class="form-check-label" th:for="${p} + '-role-' + ${r.id}"
                   th:text="${#strings.replace(r.name, 'ROLE_', '')}">USER</label>
        </div>
    </div>
</div>

</body>
</html>
